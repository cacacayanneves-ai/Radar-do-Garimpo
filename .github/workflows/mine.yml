name: Mineração — Radar do Garimpo

on:
  schedule:
    # 8 rodadas por dia, a cada 3h, de hora em hora fechada em Brasília
    # (UTC-3): 00h/03h/06h/09h/12h/15h/18h/21h. Medido em 04/09/2026: uma
    # rodada sem teto de keywords (varria a lista toda numa sessão só)
    # começava a ser bloqueada pelo Facebook depois de ~60 buscas seguidas.
    # A correção foi reduzir cada rodada (ver KEYWORDS_PER_ROUND em
    # scraper/mine.ts) e rodar mais vezes — o cursor garante que a lista
    # inteira ainda é coberta ao longo do dia, só que em pedaços que não
    # esbarram no bloqueio.
    - cron: "0 3 * * *"
    - cron: "0 6 * * *"
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
    - cron: "0 15 * * *"
    - cron: "0 18 * * *"
    - cron: "0 21 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions do GitHub

# Evita duas rodadas rodando ao mesmo tempo (ex: disparo manual em cima do
# horário de uma agendada) — a rodada nova espera a anterior terminar em vez
# de rodar em paralelo e escrever no catálogo ao mesmo tempo.
concurrency:
  group: mineracao-radar-do-garimpo
  cancel-in-progress: false

jobs:
  mine:
    runs-on: ubuntu-latest
    # Acima do teto de esforço do próprio script (70 min), pra ele conseguir
    # fechar a rodada e reportar o status em vez de ser morto no meio.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Rodar mineração
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SCRAPER_API_SECRET: ${{ secrets.SCRAPER_API_SECRET }}
        run: npm run mine
