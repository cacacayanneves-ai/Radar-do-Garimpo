name: Mineração — Radar do Garimpo

on:
  schedule:
    # 04:00 e 08:00 no horário de Brasília (UTC-3) = 07:00 e 11:00 UTC.
    # As duas rodadas terminam antes das 10:00 de Brasília, então ao acordar
    # o painel já está atualizado com tudo do dia. Cada rodada tem teto de
    # ~40 min, então a segunda (08:00) sobra folga de mais de 1h.
    - cron: "0 7 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions do GitHub

jobs:
  mine:
    runs-on: ubuntu-latest
    # Acima do teto de esforço do próprio script (70 min), pra ele conseguir
    # fechar a rodada e reportar o status em vez de ser morto no meio.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Rodar mineração
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SCRAPER_API_SECRET: ${{ secrets.SCRAPER_API_SECRET }}
        run: npm run mine
